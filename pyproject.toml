[project]
name = "gnn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.1",
    "torch>=2.13.0",
    "torch-geometric>=2.8.0.post1",
]

[project.scripts]
gnn = "gnn:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"